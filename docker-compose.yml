# Author: Ilu
# Docker configuration for the local database, used for backend development and testing

services:

  # PostgreSQL database container
  postgres:
    image: postgres:16
    container_name: mep_postgres
    restart: always

    # Database configuration
    environment:
      POSTGRES_USER: mep_user
      POSTGRES_PASSWORD: mep_password
      POSTGRES_DB: mep_server

    # Port mapping:
    # local machine port : container port
    ports:
      - "5433:5432"

    # Persistent storage for database data
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Local HAPI FHIR server for development and adapter testing
  fhir-server:
    image: hapiproject/hapi:v8.10.0-1
    container_name: careena_fhir_server
    restart: unless-stopped

    # Store HAPI's database on the mounted volume. The image default is an
    # in-memory H2 database, which loses every booking on container restart.
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/hapi/careena;DB_CLOSE_ON_EXIT=FALSE
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.h2.Driver

    # FHIR server web UI and REST API
    ports:
      - "8080:8080"
    
    # Persistent storage for local FHIR server data
    volumes:
      - fhir_data:/data/hapi


# Named Docker volume for PostgreSQL persistence
volumes:
  postgres_data:
  fhir_data:
