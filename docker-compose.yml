# Author: Ilu
# Docker configuration for the local database, used for backend development and testing

services:

  # PostgreSQL database container
  postgres:
    image: postgres:16
    container_name: mep_postgres
    restart: always

    # Database configuration
    environment:
      POSTGRES_USER: mep_user
      POSTGRES_PASSWORD: mep_password
      POSTGRES_DB: mep_server

    # Port mapping:
    # local machine port : container port
    ports:
      - "5433:5432"

    # Persistent storage for database data
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Separate persistent database for the local HAPI FHIR simulator.
  hapi-postgres:
    image: postgres:16
    container_name: careena_fhir_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi
      POSTGRES_DB: hapi
    volumes:
      - hapi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local HAPI FHIR server for development and adapter testing
  fhir-server:
    image: hapiproject/hapi:v8.10.0-1
    container_name: careena_fhir_server
    restart: unless-stopped

    depends_on:
      hapi-postgres:
        condition: service_healthy

    # The image default is an in-memory H2 database. Use a dedicated
    # PostgreSQL service so FHIR slots and bookings survive restarts.
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hapi-postgres:5432/hapi
      SPRING_DATASOURCE_USERNAME: hapi
      SPRING_DATASOURCE_PASSWORD: hapi
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_ENABLED: "false"

    # FHIR server web UI and REST API
    ports:
      - "8080:8080"
    
# Named Docker volume for PostgreSQL persistence
volumes:
  postgres_data:
  hapi_postgres_data:
