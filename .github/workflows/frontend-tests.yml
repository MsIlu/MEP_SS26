name: Frontend Tests

on:
  push:
  pull_request:

jobs:
  flutter-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test