# Author: Ilu
# Docker configuration for the local database, used for backend development and testing

services:

  # PostgreSQL database container
  postgres:
    image: postgres:16
    container_name: mep_postgres
    restart: always

    # Database configuration
    environment:
      POSTGRES_USER: mep_user
      POSTGRES_PASSWORD: mep_password
      POSTGRES_DB: mep_server

    # Port mapping:
    # local machine port : container port
    ports:
      - "5433:5432"

    # Persistent storage for database data
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Local HAPI FHIR server for development and adapter testing
  fhir-server:
    image: hapiproject/hapi:latest
    container_name: careena_fhir_server
    restart: unless-stopped

    # FHIR server web UI and REST API
    ports:
      - "8080:8080"
    
    # Persistent storage for local FHIR server data
    volumes:
      - fhir_data:/data/hapi

    # Proof of reaching the FHIR server with "healthy" as return
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/fhir/metadata"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

# Named Docker volume for PostgreSQL persistence
volumes:
  postgres_data:
  fhir_data: